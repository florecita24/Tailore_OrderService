<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailoré | Bold Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- PALET BLACK PINK WHITE --- */
        :root {
            --hitam: #000000;
            --putih: #ffffff;
            --pink-neon: #ff477e; /* Pink yang lebih 'nendang' */
            --pink-soft: #ffeef2;
            --abu: #f4f4f4;
        }

        /* RESET */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--abu); color: var(--hitam); line-height: 1.6; }

        /* HEADER: Hitam Pekat */
        header { background: var(--hitam); color: var(--putih); padding: 1.5rem 0; text-align: center; margin-bottom: 2rem; border-bottom: 4px solid var(--pink-neon); }
        header h1 { font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-size: 2rem; }
        header span { color: var(--pink-neon); }

        /* CONTAINER */
        .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }

        /* CARD: Putih dengan Border Hitam Tegas */
        .card { background: var(--putih); border: 2px solid var(--hitam); border-radius: 0; /* Kotak tajam biar edgy */ padding: 2rem; box-shadow: 6px 6px 0px var(--hitam); /* Shadow kasar ala retro */ margin-bottom: 2rem; }
        .card h3 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--hitam); border-bottom: 2px solid var(--hitam); padding-bottom: 0.5rem; text-transform: uppercase; font-weight: 800; }

        /* INPUTS */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 1rem; border: 2px solid var(--hitam); background: var(--putih); font-size: 1rem; font-weight: 600; transition: 0.2s; border-radius: 0; }
        input:focus, select:focus { outline: none; border-color: var(--pink-neon); background: var(--pink-soft); }

        /* PRICE BOX */
        .price-box { background: var(--hitam); color: var(--putih); padding: 1.5rem; text-align: right; margin: 1.5rem 0; border: 2px solid var(--hitam); }
        .price-label { font-size: 0.9rem; color: var(--pink-neon); text-transform: uppercase; letter-spacing: 1px; }
        .price-value { font-size: 2rem; font-weight: 800; }

        /* BUTTONS: Hitam -> Pink */
        button { width: 100%; padding: 1.2rem; background: var(--hitam); color: var(--putih); border: none; font-size: 1.1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; position: relative; top: 0; }
        button:hover { background: var(--pink-neon); color: var(--putih); top: -4px; box-shadow: 0 4px 0 #990033; }
        
        /* Refresh Button */
        .btn-refresh { background: var(--putih); color: var(--hitam); border: 2px solid var(--hitam); width: auto; padding: 0.5rem 1.5rem; font-size: 0.8rem; box-shadow: 4px 4px 0 var(--hitam); margin-bottom: 1rem; }
        .btn-refresh:hover { background: var(--pink-neon); color: var(--putih); box-shadow: 2px 2px 0 var(--hitam); top: 2px; }

        /* TABLE */
        .table-responsive { overflow-x: auto; border: 2px solid var(--hitam); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: var(--hitam); color: var(--putih); padding: 1rem; text-align: left; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        td { padding: 1rem; border-bottom: 1px solid #ddd; background: var(--putih); font-weight: 600; }
        tr:nth-child(even) td { background: var(--pink-soft); } /* Selang seling pink muda */
        
        /* Status Badge */
        .status-badge { background: var(--hitam); color: var(--pink-neon); padding: 5px 10px; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; border: 1px solid var(--pink-neon); }

        /* FOOTER */
        footer { text-align: center; padding: 2rem; color: var(--hitam); font-weight: 600; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <h1>Tailoré<span>.</span></h1>
    </header>

    <div class="container">
        
        <div class="card">
            <h3>New Order</h3>
            
            <div class="form-group">
                <label>CUSTOMER NAME</label>
                <input type="text" id="nama" placeholder="ENTER YOUR NAME">
            </div>

            <div class="form-group">
                <label>SELECT ITEM</label>
                <select id="produk" onchange="hitungTotal()">
                    <option value="101" data-harga="50000">BASIC BLACK TEE (IDR 50.000)</option>
                    <option value="102" data-harga="150000">OVERSIZED HOODIE (IDR 150.000)</option>
                    <option value="103" data-harga="85000">CROP TOP PINK (IDR 85.000)</option>
                    <option value="104" data-harga="300000">LEATHER JACKET (IDR 300.000)</option>
                </select>
            </div>

            <div class="form-group">
                <label>QUANTITY</label>
                <input type="number" id="jumlah" value="1" min="1" onchange="hitungTotal()">
            </div>

            <div class="price-box">
                <div class="price-label">TOTAL AMOUNT</div>
                <div class="price-value" id="total">IDR 50.000</div>
            </div>

            <button onclick="kirimOrder()">Checkout Now</button>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin-bottom: 0; border: none;">HISTORY</h3>
                <button onclick="ambilData()" class="btn-refresh">REFRESH</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>NAME</th>
                            <th>ITEM CODE</th>
                            <th>TOTAL</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-order">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 TAILORÉ PROJECT.
    </footer>

    <script>
        // --- LOGIC (TIDAK BERUBAH) ---
        const API_URL = '/api/orders'; 
        const SECRET_KEY = 'rahasia123';

        function formatRupiah(angka) {
            return 'IDR ' + new Intl.NumberFormat('id-ID').format(angka);
        }

        function hitungTotal() {
            const select = document.getElementById('produk');
            const harga = select.options[select.selectedIndex].getAttribute('data-harga');
            const jumlah = document.getElementById('jumlah').value;
            const total = harga * jumlah;
            document.getElementById('total').innerText = formatRupiah(total);
        }

        async function kirimOrder() {
            const nama = document.getElementById('nama').value;
            const select = document.getElementById('produk');
            const produkId = select.value;
            const hargaSatuan = select.options[select.selectedIndex].getAttribute('data-harga');
            const jumlah = document.getElementById('jumlah').value;
            const total = hargaSatuan * jumlah;

            if(!nama) return alert("NAMA HARUS DIISI!");

            const dataKirim = {
                customer_name: nama,
                product_id: produkId,
                quantity: jumlah,
                total_price: total
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-secret-key': SECRET_KEY },
                    body: JSON.stringify(dataKirim)
                });
                
                if(response.ok) {
                    alert('SUCCESS! ORDER PLACED.');
                    document.getElementById('nama').value = '';
                    ambilData();
                } else {
                    alert('FAILED.');
                }
            } catch (error) {
                console.error(error);
                alert('SERVER ERROR');
            }
        }

        async function ambilData() {
            try {
                const response = await fetch(API_URL, { headers: { 'x-secret-key': SECRET_KEY } });
                const json = await response.json();
                const tbody = document.getElementById('tabel-order');
                tbody.innerHTML = ''; 

                if(json.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem;">NO DATA YET.</td></tr>';
                    return;
                }

                json.data.forEach(item => {
                    const row = `<tr>
                        <td>#${item.id}</td>
                        <td>${item.customer_name}</td>
                        <td>${item.product_id}</td>
                        <td>${formatRupiah(item.total_price)}</td>
                        <td><span class="status-badge">${item.status}</span></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Gagal ambil data");
            }
        }

        ambilData();
    </script>
</body>
</html>
